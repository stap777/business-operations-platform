spring:
  application:
    name: as-enterprises-bms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8085}
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@asenterprises.com}
    from-name: ${MAIL_FROM_NAME:A.S. Enterprises BMS}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}

session:
  expiration: ${SESSION_EXPIRATION:86400000} # 24 Hours in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

