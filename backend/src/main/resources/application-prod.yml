spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 20000
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1.0
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

session:
  expiration: ${SESSION_EXPIRATION:86400000}


app:
  frontend-url: ${APP_FRONTEND_URL:https://aven-frontend.onrender.com}
  mail:
    from: ${MAIL_FROM:noreply@asenterprises.com}
    from-name: ${MAIL_FROM_NAME:A.S. Enterprises BMS}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://aven.asenterprises.com}}

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG
    org.hibernate: INFO
    org.springframework.orm: DEBUG
    org.springframework.security: DEBUG
    com.asenterprises.bms: INFO
    STARTUP_FORENSICS: INFO
